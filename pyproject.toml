[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gui-action-coordinate-grounder"
version = "0.1.0"
description = "Maps normalized [0..1000] VLM click/drag coordinates across multi-monitor DPI scaling, taskbar insets, and viewport scroll offsets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
gui-action-coordinate-grounder = "gui_action_coordinate_grounder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gui_action_coordinate_grounder*"]
